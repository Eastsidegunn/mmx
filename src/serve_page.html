<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mmx cockpit</title>
  <style>
    body { font: 15px/1.5 system-ui,sans-serif; color:#23272e; max-width:1440px; margin:24px auto; padding:0 16px; }
    .layout { display:grid; grid-template-columns:minmax(0,1fr); gap:20px; }
    @media (min-width: 1100px) { .layout { grid-template-columns:minmax(0,1fr) 280px; } }
    aside { min-width:0; }
    @media (min-width: 1100px) { aside { max-height:calc(min(72vh, 820px) + 80px); overflow-y:auto; } }
    header { display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:16px; }
    h1 { font-size:1.3rem; margin:0; }
    #turn { color:#555; }
    #status { min-height:1.5em; margin:10px 0; color:#9b351e; white-space:pre-wrap; }
    #status:not(:empty) { background:#fff3ec; border-left:3px solid #b04a17; padding:6px 10px; border-radius:0 6px 6px 0; }
    #banner { display:flex; flex-wrap:wrap; gap:4px 16px; align-items:baseline; margin:0 0 12px; padding:6px 10px; font-size:13.5px; line-height:1.4; background:#fff8db; border-left:3px solid #e6a700; border-radius:0 6px 6px 0; }
    #banner[hidden] { display:none; }
    #banner-task { font-weight:600; color:#23272e; }
    #banner-task:empty { display:none; }
    #banner-instruction { color:#555; }
    #banner.collapsed #banner-instruction, #banner.collapsed #banner-task { display:none; }
    #banner-short { display:none; color:#555; }
    #banner.collapsed #banner-short { display:inline; }
    mmx-editor { --mmx-height: min(72vh, 820px); }
    #history { margin:4px 0 0; padding:0; list-style:none; font-size:13.5px; color:#444; }
    #history li { padding:4px 0; border-top:1px solid #eee8df; }
    #history .who { font-weight:600; color:#23272e; }
    #history .when { color:#999; margin-left:8px; font-size:12px; }
    #history-title { margin:0 0 4px; font-size:13px; color:#888; }
    #history #history-empty { color:#999; border-top:none; }
    #history .note { white-space:pre-wrap; }
    #history .note.none { color:#999; }
    #history .summary { color:#777; font-size:12.5px; }
    #history .summary.error { color:#9b351e; }
  </style>
</head>
<body>
  <header><h1>mmx cockpit</h1><span id="turn">Loading…</span></header>
  <div id="status" role="status" aria-live="polite"></div>
  <button id="load-current" hidden>Load current state</button>
  <div id="banner" hidden><span id="banner-task"></span><span id="banner-instruction"></span><span id="banner-short"></span></div>
  <div class="layout">
    <mmx-editor></mmx-editor>
    <aside>
      <div id="history-title">Turn history</div>
      <ul id="history"><li id="history-empty">No turns yet — sent and received turns appear here</li></ul>
    </aside>
  </div>
  <script src="/editor.js"></script>
  <script>

    const turn = document.querySelector('#turn');

      c.nodesAdded && parts.nodes(c.nodesAdded), c.edgesAdded && parts.edges(c.edgesAdded),
      c.renamed && parts.renamed(c.renamed), c.relabeled && parts.relabeled(c.relabeled),
      c.deleted && parts.deleted(c.deleted),

          pendingOps: n => `변경 ${n}건 대기 중`, idle: '노드를 더블클릭해 이름을 바꾸고, ● 핸들을 끌어 연결하세요',
          manualMode: '옮긴 노드의 위치는 임시입니다 — 턴을 보내거나 받으면 자동 배치로 돌아갑니다',
          connected: (a,b) => `${a} → ${b} 연결됨`, deleted: id => `${id} 삭제됨 — 다시 누르면 취소`,
          nothingToSend: '보낼 변경도 메모도 없습니다', staged: '(배치 전)', newNodeLabel: '새 노드'
        }
      },
      'zh-CN': {
        title: 'mmx 编辑台', loading: '加载中…', loadCurrent: '加载最新状态',
        historyTitle: '交互记录', historyEmpty: '暂无记录，发送和收到的交互会显示在这里',
        you: '我', start: '开始', noNote: '（无备注）', dateLocale: 'zh-CN',
        summaryError: error => `错误：${error}`, node: '节点', edge: '连线', noDiagramChange: '图表未更改', firstPicture: '初始图表',
        historyFailed: status => `加载交互记录失败（${status}）`,
        stateFailed: status => `加载状态失败（${status}）`,
        noTurns: '暂无交互，编辑草稿后即可发送第一轮',
        lastTurn: (by, note) => `上次交互：${by}${note ? ' · ' + note : ''}`,
        newTurn: '收到新一轮交互，发送或撤销当前修改后视图将更新',

        position: (line, column) => line ? `（第 ${line} 行${column ? `，第 ${column} 列` : ''}）` : '',
        invalidSource: (kind, place, message) => `${kind} 错误${place}：${message}`,

        lossy: '警告：这次编辑涉及无法直接修改的语法（如 & 分组），因此重写了图表文本；虚线箭头或注释等格式可能丢失',

          nothingToSend: '没有可发送的更改或备注', staged: '（尚未放置）', newNodeLabel: '新节点'
        }
      },

        you: 'あなた', start: '開始', noNote: '（メモなし）', dateLocale: 'ja-JP',
        summaryError: error => `エラー：${error}`, node: 'ノード', edge: '接続', noDiagramChange: 'ダイアグラムの変更なし', firstPicture: '最初のダイアグラム',
        historyFailed: status => `履歴を読み込めませんでした（${status}）`,
        stateFailed: status => `状態を読み込めませんでした（${status}）`,

        lastTurn: (by, note) => `前回のターン: ${by}${note ? ' · ' + note : ''}`,
        newTurn: '新しいターンが届きました。編集内容を送信するか元に戻すと、表示が更新されます',
        conflict: '競合：エージェントが先にダイアグラムを変更しました。最新の状態を読み込んでください',
        sendFailed: status => `送信できませんでした（${status}）`,
        position: (line, column) => line ? `（${line}行目${column ? `、${column}列目` : ''}）` : '',
        invalidSource: (kind, place, message) => `${kind} エラー${place}：${message}`,
        noChange: '変更なし',
        lossy: '警告：この編集は直接書き換えられない構文（& グループなど）を含むため、ダイアグラムのテキストを書き直しました。破線の矢印やコメントなど、一部の書式が失われた可能性があります',
        reconnecting: '再接続中…',
        bannerInstruction: '図の間違った接続や足りない接続を直すか、決定ボックスを編集して送信を押してください。エージェントは次のターンで答えます。読む順番：黄色の箱 → 色付きの箱 → ピンクの決定 / 灰色の決定済み。',

        editor: {
          addNode: '+ ノード', send: 'ターンを送信', sendWithCount: n => `ターンを送信（変更 ${n} 件）`,

          pendingOps: n => `未送信の変更 ${n} 件`, idle: 'ノードをダブルクリックで名前を変更、● ハンドルをドラッグで接続',
          manualMode: '移動したノードの位置は一時的です。ターンを送受信すると自動配置に戻ります',

          nothingToSend: '送信する変更やメモがありません', staged: '（未配置）', newNodeLabel: '新しいノード'
        }
      },
      es: {
        title: 'Panel de mmx', loading: 'Cargando…', loadCurrent: 'Cargar el estado actual',

        summaryError: error => `Error: ${error}`, node: 'Nodo', edge: 'Conexión', noDiagramChange: 'Sin cambios en el diagrama', firstPicture: 'Primera versión del diagrama',
        historyFailed: status => `No se pudo cargar el historial (${status})`,
        stateFailed: status => `No se pudo cargar el estado (${status})`,
        noTurns: 'Aún no hay turnos — edita el borrador para enviar el primero',
        lastTurn: (by, note) => `Último turno: ${by}${note ? ' · ' + note : ''}`,
        newTurn: 'Nuevo turno recibido — la vista se actualizará cuando envíes o reviertas tus cambios',
        conflict: 'Conflicto: el agente modificó el diagrama antes que tú — carga el estado actual',
        sendFailed: status => `No se pudo enviar el turno (${status})`,
        position: (line, column) => line ? ` (línea ${line}${column ? `, columna ${column}` : ''})` : '',
        invalidSource: (kind, place, message) => `Error de ${({parse:'de sintaxis',encoding:'de codificación'})[kind] ?? `(${kind})`}${place}: ${message}`,

        lossy: 'Advertencia: esta edición afectó a sintaxis que no se puede modificar directamente (como un grupo &), así que se reescribió el texto del diagrama. Puede que se hayan perdido algunos detalles de formato, como flechas discontinuas o comentarios',

        bannerInstruction: 'Corrige en la imagen las conexiones erróneas o que faltan, o edita una casilla de decisión, y pulsa Enviar; el agente responde en el siguiente turno. Orden de lectura: casilla amarilla → casillas de colores → decisiones rosas / decisiones grises ya tomadas.',
        bannerShort: 'Enviado — el agente responde en el siguiente turno.',
        editor: {
          addNode: '+ Nodo', send: 'Enviar turno', sendWithCount: n => `Enviar turno (${n} ${n === 1 ? 'cambio' : 'cambios'})`,

          notePlaceholder: 'Nota o pregunta — puedes enviar un turno sin cambiar el diagrama',
          menuEdit: '✎ Editar', menuDelete: '✕ Eliminar',
          menuLabel: 'Etiqueta', apply: 'Aplicar', label: 'Etiqueta',
          pendingDetail: pendingDetail('Pendiente: ', { nodes: n => `+${n} ${n === 1 ? 'nodo' : 'nodos'}`, edges: n => `+${n} ${n === 1 ? 'conexión' : 'conexiones'}`, renamed: n => `${n} ${n === 1 ? 'renombrado' : 'renombrados'}`, relabeled: n => `${n} ${n === 1 ? 'etiqueta cambiada' : 'etiquetas cambiadas'}`, deleted: n => `${n} ${n === 1 ? 'eliminado' : 'eliminados'}` }),
          pendingOps: n => `${n} ${n === 1 ? 'cambio pendiente' : 'cambios pendientes'}`, idle: 'Haz doble clic en un nodo para renombrarlo; arrastra el punto ● para conectar nodos',
          manualMode: 'Los nodos movidos tienen posiciones temporales — al enviar o recibir un turno se restablece la distribución automática',
          connected: (a,b) => `${a} → ${b} conectados`, deleted: id => `${id} eliminado — haz clic de nuevo para deshacer`,
          nothingToSend: 'No hay cambios ni nota que enviar', staged: '(sin colocar)', newNodeLabel: 'Nodo nuevo'
        }
      }
    };
    const requestedLang = new URLSearchParams(location.search).get('lang');
    const browserLang = navigator.language.toLowerCase();
    const lang = requestedLang === 'zh' ? 'zh-CN'
      : Object.hasOwn(translations, requestedLang) ? requestedLang
      : browserLang.startsWith('ko') ? 'ko'
      : browserLang.startsWith('zh') ? 'zh-CN'
      : browserLang.startsWith('ja') ? 'ja'
      : browserLang.startsWith('es') ? 'es' : 'en';
    const t = translations[lang];
    document.documentElement.lang = lang;
    document.title = t.title;
    document.querySelector('h1').textContent = t.title;
    turn.textContent = t.loading;
    loadCurrent.textContent = t.loadCurrent;
    document.querySelector('#history-title').textContent = t.historyTitle;
    document.querySelector('#history-empty').textContent = t.historyEmpty;
    ed.strings = t.editor;
    const banner = document.querySelector('#banner');
    document.querySelector('#banner-instruction').textContent = t.bannerInstruction;
    document.querySelector('#banner-short').textContent = t.bannerShort;
    let seq = -1;
    let epoch = null;
    let waitingSeq = -1;
    let sending = false;
    // Banner inputs: the live state's speaker/note and the newest agent
    // note in the log; collapsed once this page has sent a turn, until the
    // agent speaks again.
    let bannerState = null;
    let bannerHistory = [];
    let bannerCollapsed = false;
    let expandedAtSeq = -1;
    const history = document.querySelector('#history');
    // The baseline render ('serve'/'unknown') is not a speaker; anyone else
    // who is not the human counts as the agent.
    const isAgent = by => by && by !== 'human' && by !== 'serve' && by !== 'unknown';
    const firstLine = note => (note || '').split('\n').find(l => l.trim()) || '';
    function renderBanner() {
      // The first screen: what Send means, and the agent's "to do" line —
      // only when the newest turn is the agent's; an older note is stale.
      const s = bannerState;
      const newest = s || bannerHistory[bannerHistory.length - 1];
      document.querySelector('#banner-task').textContent = newest && isAgent(newest.by) ? firstLine(newest.note) : '';
      banner.classList.toggle('collapsed', bannerCollapsed);
      banner.hidden = s === null;
    }
    function changeSummary(m) {
      // One line from the server's generic counts.
      if (m.error) return t.summaryError(m.error);
      // The first render is the starting picture, not "no change".
      if (m.baseline) return t.firstPicture;
      const part = (name, a, r, c) => {
        const bits = [];
        if (a) bits.push(`+${a}`);
        if (r) bits.push(`−${r}`);
        if (c) bits.push(`~${c}`);
        return bits.length ? `${name} ${bits.join(' ')}` : '';
      };
      const text = [
        part(t.node, m.nodes_added, m.nodes_removed, m.nodes_changed),
        part(t.edge, m.edges_added, m.edges_removed, m.edges_changed),
      ].filter(Boolean).join(' · ');
      return text || t.noDiagramChange;
    }
    function renderHistory(entries) {
      // The whole conversation from the turn log, latest first.
      bannerHistory = entries;
      renderBanner();
      history.replaceChildren();
      if (!entries.length) {
        const li = document.createElement('li');
        li.id = 'history-empty';
        li.textContent = t.historyEmpty;
        history.append(li);
        return;
      }
      for (const e of [...entries].reverse()) {
        const li = document.createElement('li');
        const who = document.createElement('span');
        who.className = 'who';
        // 'serve'/'unknown' is the baseline render, not a speaker.
        who.textContent = e.by === 'human' ? t.you
          : (!e.by || e.by === 'serve' || e.by === 'unknown') ? t.start : e.by;
        const when = document.createElement('span');
        when.className = 'when';
        when.textContent = e.at ? new Date(e.at).toLocaleString(t.dateLocale) : '';
        const note = document.createElement('div');
        note.className = e.note ? 'note' : 'note none';
        note.textContent = e.note || t.noNote;
        const summary = document.createElement('div');
        summary.className = e.summary && e.summary.error ? 'summary error' : 'summary';
        summary.textContent = changeSummary(e.summary || {});
        li.append(who, when, note, summary);
        history.append(li);
      }
    }
    async function loadHistory() {
      const response = await fetch('/history', {cache:'no-store'});
      if (!response.ok) throw new Error(t.historyFailed(response.status));
      renderHistory((await response.json()).entries || []);
    }
    function showState(s) {
      ed.load(s);
      seq = s.seq;
      epoch = s.epoch;
      // 'serve'/'unknown' means the baseline render, not a conversation turn.
      turn.textContent = (!s.by || s.by === 'unknown' || s.by === 'serve')
        ? t.noTurns
        : t.lastTurn(s.by === 'human' ? t.you : s.by, s.note);
      status.textContent = '';
      loadCurrent.hidden = true;
      // An agent turn with a note re-expands; a poller-rendered edit with
      // no note is not the agent speaking.
      if (isAgent(s.by) && firstLine(s.note) && bannerState !== null && s.seq !== bannerState.seq) {
        bannerCollapsed = false;
        expandedAtSeq = s.seq;
      }
      bannerState = s;
      renderBanner();
    }
    async function refresh() {
      const response = await fetch('/state', {cache:'no-store'});
      if (!response.ok) throw new Error(t.stateFailed(response.status));
      const state = await response.json();
      if (epoch !== null && state.epoch !== epoch) {
        showState(state);
        waitingSeq = -1;
      } else if (ed.pendingOps() > 0 || sending) {
        waitingSeq = Math.max(waitingSeq, state.seq);
        status.textContent = t.newTurn;
      } else if (state.seq >= seq) {
        showState(state);
        waitingSeq = -1;
      }
    }
    ed.addEventListener('mmx-submit', async event => {
      sending = true;
      try {
        const response = await fetch('/turn', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({source:event.detail.source, note:event.detail.note, base_seq:seq})
        });
        if (response.status === 409) {
          await response.json();
          status.textContent = t.conflict;
          loadCurrent.hidden = false;
          return;
        }
        if (!response.ok) throw new Error(t.sendFailed(response.status));
        const result = await response.json();
        if (result.exit === 2) {
          const e = result.diff.error;
          const place = t.position(e.line, e.column);
          status.textContent = t.invalidSource(e.kind, place, e.message);
        } else if (result.noop) {
          await refreshStateAfterNoop();
          status.textContent = t.noChange;
        } else {
          showState({...result.state, svg:result.svg});
          // Collapse for the turn just sent, unless a newer agent note
          // already expanded the banner while the send was in flight.
          if (expandedAtSeq <= result.state.seq) bannerCollapsed = true;
          renderBanner();
          ed.setNote('');
          if (event.detail.lossy) {
            status.textContent = t.lossy;
          }
        }
      } catch (error) { status.textContent = error.message; }
      finally {
        sending = false;
        if (loadCurrent.hidden && waitingSeq > seq && ed.pendingOps() === 0) refresh().catch(error => status.textContent = error.message);
      }
    });
    async function refreshStateAfterNoop() {
      const response = await fetch('/state', {cache:'no-store'});
      if (!response.ok) throw new Error(t.stateFailed(response.status));
      showState(await response.json());
    }
    loadCurrent.addEventListener('click', () => refreshStateAfterNoop().catch(error => status.textContent = error.message));
    ed.addEventListener('mmx-change', () => {
      if (loadCurrent.hidden && waitingSeq > seq && ed.pendingOps() === 0 && !sending) refresh().catch(error => status.textContent = error.message);
    });
    refresh().catch(error => status.textContent = error.message);
    loadHistory().catch(error => status.textContent = error.message);
    const events = new EventSource('/events');
    events.onmessage = event => {
      const next = JSON.parse(event.data);
      loadHistory().catch(error => status.textContent = error.message);
      if (epoch === null || next.epoch !== epoch || next.seq > seq) {
        refresh().catch(error => status.textContent = error.message);
      }
    };
    events.onerror = () => { if (!status.textContent) status.textContent = t.reconnecting; };
  </script>
</body>
</html>

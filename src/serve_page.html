<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>mmx 조종석</title>
  <style>
    body { font: 15px/1.5 system-ui,sans-serif; color:#23272e; max-width:1100px; margin:24px auto; padding:0 16px; }
    header { display:flex; align-items:baseline; gap:20px; flex-wrap:wrap; margin-bottom:16px; }
    h1 { font-size:1.3rem; margin:0; }
    #turn { color:#555; }
    #status { min-height:1.5em; margin:10px 0; color:#9b351e; white-space:pre-wrap; }
  </style>
</head>
<body>
  <header><h1>mmx 조종석</h1><span id="turn">불러오는 중…</span></header>
  <div id="status" role="status" aria-live="polite"></div>
  <button id="load-current" hidden>현 상태 불러오기</button>
  <mmx-editor></mmx-editor>
  <script src="/editor.js"></script>
  <script>
    const ed = document.querySelector('mmx-editor');
    const status = document.querySelector('#status');
    const turn = document.querySelector('#turn');
    const loadCurrent = document.querySelector('#load-current');
    ed.strings = {
      addNode: '+ 노드', send: '보내기', revert: '되돌리기', autoLayout: '자동 배치',
      notePlaceholder: '이번 턴의 메모', menuEdit: '✎ 편집', menuDelete: '✕ 삭제',
      menuLabel: '라벨', apply: '확인', label: '라벨',
      pendingOps: n => `${n}개 변경 대기 중`, idle: '노드나 화살표를 선택해 편집하세요',
      manualMode: '임시 배치 — 보내거나 새 턴을 받으면 자동 배치됩니다',
      connected: (a,b) => `${a} → ${b} 연결됨`, deleted: id => `${id} 삭제됨 — 다시 누르면 취소`,
      nothingToSend: '보낼 변경이 없습니다', staged: '(배치 전)', newNodeLabel: '새 노드'
    };
    let seq = -1;
    let epoch = null;
    let waitingSeq = -1;
    let sending = false;
    function showState(s) {
      ed.load(s);
      seq = s.seq;
      epoch = s.epoch;
      turn.textContent = `마지막 턴: ${s.by || 'serve'}${s.note ? ' · ' + s.note : ''}`;
      status.textContent = '';
      loadCurrent.hidden = true;
    }
    async function refresh() {
      const response = await fetch('/state', {cache:'no-store'});
      if (!response.ok) throw new Error(`상태 조회 실패 (${response.status})`);
      const state = await response.json();
      if (epoch !== null && state.epoch !== epoch) {
        showState(state);
        waitingSeq = -1;
      } else if (ed.pendingOps() > 0 || sending) {
        waitingSeq = Math.max(waitingSeq, state.seq);
        status.textContent = '새 턴 도착 — 보내기/되돌리기 후 갱신됩니다';
      } else if (state.seq >= seq) {
        showState(state);
        waitingSeq = -1;
      }
    }
    ed.addEventListener('mmx-submit', async event => {
      sending = true;
      try {
        const response = await fetch('/turn', {
          method:'POST', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({source:event.detail.source, note:event.detail.note, base_seq:seq})
        });
        if (response.status === 409) {
          const conflict = await response.json();
          status.textContent = '충돌: 에이전트가 먼저 바꿈 — 현 상태 불러오기';
          loadCurrent.hidden = false;
          return;
        }
        if (!response.ok) throw new Error(`전송 실패 (${response.status})`);
        const result = await response.json();
        if (result.exit === 2) {
          const e = result.diff.error;
          const place = e.line ? ` (${e.line}행${e.column ? ` ${e.column}열` : ''})` : '';
          status.textContent = `${e.kind} 오류${place}: ${e.message}`;
        } else if (result.noop) {
          await refreshStateAfterNoop();
          status.textContent = '변경 없음';
        } else {
          showState({...result.state, svg:result.svg});
          ed.setNote('');
        }
      } catch (error) { status.textContent = error.message; }
      finally {
        sending = false;
        if (loadCurrent.hidden && waitingSeq > seq && ed.pendingOps() === 0) refresh().catch(error => status.textContent = error.message);
      }
    });
    async function refreshStateAfterNoop() {
      const response = await fetch('/state', {cache:'no-store'});
      if (!response.ok) throw new Error(`상태 조회 실패 (${response.status})`);
      showState(await response.json());
    }
    loadCurrent.addEventListener('click', () => refreshStateAfterNoop().catch(error => status.textContent = error.message));
    ed.addEventListener('mmx-change', () => {
      if (loadCurrent.hidden && waitingSeq > seq && ed.pendingOps() === 0 && !sending) refresh().catch(error => status.textContent = error.message);
    });
    refresh().catch(error => status.textContent = error.message);
    const events = new EventSource('/events');
    events.onmessage = event => {
      const next = JSON.parse(event.data);
      if (epoch === null || next.epoch !== epoch || next.seq > seq) {
        refresh().catch(error => status.textContent = error.message);
      }
    };
    events.onerror = () => { if (!status.textContent) status.textContent = '연결 재시도 중…'; };
  </script>
</body>
</html>

[package]
name = "mmx"
version = "0.2.0"
edition = "2021"
description = "Conversational diagram protocol: humans and agents talk through mermaid diffs"
license = "MIT"
repository = "https://github.com/Eastsidegunn/mmx"
readme = "README.md"
keywords = ["mermaid", "diagram", "agent", "diff", "cli"]
categories = ["command-line-utilities", "visualization"]

[dependencies]
mermaid-rs-renderer = "=0.3.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

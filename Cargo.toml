[package]
name = "mmx"
version = "0.4.3"
edition = "2021"
description = "Edit an AI agent's Mermaid diagram on the picture; the agent sees exactly what you changed"
license = "MIT"
repository = "https://github.com/Eastsidegunn/mmx"
readme = "README.md"
keywords = ["mermaid", "diagram", "agent", "diff", "cli"]
categories = ["command-line-utilities", "visualization"]
include = [
    "/Cargo.toml", "/Cargo.lock", "/README.md", "/LICENSE", "/INSTALL.md", "/CHANGELOG.md",
    "/src/**", "/editor/mmx-editor.js", "/skills/mmx/**",
    "/adapters/mmx_hook.py", "/adapters/claude/settings.json",
    "/adapters/codex/hooks.json",
    "/examples/diagram.mmd", "/examples/onboarding.mmd",
]

[dependencies]
mermaid-rs-renderer = "=0.3.1"
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
anyhow = "1"

[profile.release]
lto = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

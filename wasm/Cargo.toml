[package]
name = "mmx-wasm"
version = "0.1.0"
edition = "2021"
description = "Browser build of the mmx turn: real render + diff + state, no server"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
mmx = { path = ".." }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
